services:
  frontend:
    image: ${DOCKERHUB_USERNAME}/zidd3.0_docker_employeeapp:${FRONTEND_IMAGE_TAG}

    container_name: frontend-container

    ports:
      - "${FRONTEND_PORT}:80"

    depends_on:
      backend:
        condition: service_healthy
    
    healthcheck:
      test: 
        [
          "CMD", 
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80/"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  
  backend:
    image: ${DOCKERHUB_USERNAME}/zidd3.0_docker_employeeapp:${BACKEND_IMAGE_TAG}

    container_name: backend-container

    ports:
      - "${BACKEND_PORT}:8080"
    
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    
    depends_on:
      database:
        condition: service_healthy
      
    healthcheck:
      test: 
        [
          "CMD", 
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/api/employees/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  database:
    image: postgres:17

    container_name: employee-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: